[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orgtwin"
version = "0.4.0"
description = "OrgTwin — цифровой двойник операционного организма компании (Information/Action, агентная симуляция In Silico)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OrgTwin contributors" }]
keywords = ["organization", "digital-twin", "process-mining", "simulation", "operations"]
dependencies = [
  "pm4py>=2.7.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
]

[project.urls]
Repository = "https://github.com/andreyivan4enkov/orgtwin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orgtwin = ["py.typed"]
